<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Page</title>
</head>
<body>

    <!-- Header Section -->
    <h1>Contact Me</h1>
    <p>Aap photo editing ya kisi bhi requirement ke liye humse contact kar sakte hain.</p>

    <hr>

    <!-- Form Section -->
    <h2>Contact Form</h2>
    <form>
        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Apna naam likhein"><br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="email" placeholder="Apna email address likhein"><br><br>

        <label for="message">What edit do you need?:</label><br>
        <textarea id="message" name="message" rows="5" cols="40" placeholder="Yahan apna message likhein..."></textarea><br><br>

        <button type="submit">Submit</button>
    </form>

    <hr>

    <!-- Navigation Back to Home -->
    <p><a href="index.html">Go Back to Main Page</a></p>

</body>
</html>
